<header class="fixed top-0 left-0 right-0 z-50 bg-secondary/95 backdrop-blur-sm shadow-md">
  <div class="container mx-auto px-4 py-4 flex justify-between items-center">
    <a routerLink="/" class="text-xl font-bold text-white">IFTS N° 14</a>
    
    <!-- Mobile menu button -->
    <button class="md:hidden text-white" (click)="toggleMobileMenu()" [class.active]="isMobileMenuOpen">
      <span class="material-symbols-outlined text-3xl">menu</span>
    </button>

    <!-- Desktop Navigation -->
    <nav class="hidden md:flex items-center space-x-6">
      <a routerLink="/" routerLinkActive="text-primary" [routerLinkActiveOptions]="{exact: true}" class="text-white hover:text-primary transition-colors">Inicio</a>
      <a routerLink="/institucional" routerLinkActive="text-primary" class="text-white hover:text-primary transition-colors">Instituto</a>
      <a routerLink="/carreras" routerLinkActive="text-primary" class="text-white hover:text-primary transition-colors">
        Tecnicaturas
      </a>
      <a routerLink="/estudiantes" routerLinkActive="text-primary" class="text-white hover:text-primary transition-colors">Estudiantes</a>
    </nav>
    
    <a href="#" class="hidden md:flex bg-primary text-white px-4 py-2 rounded-full items-center space-x-2 hover:bg-[#d17509] transition-colors">
      <span>Contactános</span>
      <span class="material-symbols-outlined text-base">arrow_forward</span>
    </a>
  </div>

  <!-- Mobile Navigation -->
  <div class="md:hidden" [class.hidden]="!isMobileMenuOpen">
    <nav class="bg-secondary/98 px-4 py-4 space-y-3">
      <a routerLink="/" routerLinkActive="text-primary" [routerLinkActiveOptions]="{exact: true}" class="block text-white hover:text-primary transition-colors py-2" (click)="toggleMobileMenu()">Inicio</a>
      <a routerLink="/institucional" routerLinkActive="text-primary" class="block text-white hover:text-primary transition-colors py-2" (click)="toggleMobileMenu()">Instituto</a>
      <a routerLink="/carreras" routerLinkActive="text-primary" class="block text-white hover:text-primary transition-colors py-2" (click)="toggleMobileMenu()">Tecnicaturas</a>
      <a routerLink="/estudiantes" routerLinkActive="text-primary" class="block text-white hover:text-primary transition-colors py-2" (click)="toggleMobileMenu()">Estudiantes</a>
      <a href="#" class="block bg-primary text-white px-4 py-2 rounded-full text-center hover:bg-[#d17509] transition-colors mt-4">Contactános</a>
    </nav>
  </div>
</header>
